quarkus.application.name=csv-team-stats-persistence-quarkus
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/team_stats_db}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASS:postgres}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:5}
quarkus.datasource.jdbc.additional-jdbc-properties.reWriteBatchedInserts=true
quarkus.flyway.migrate-at-start=true
app.kafka.bootstrap=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.registry=${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}
app.kafka.group=${KAFKA_CONSUMER_GROUP_ID:csv-team-stats-persistence}
app.kafka.input=${KAFKA_PARSED_TEAM_STATS_TOPIC:team-stats.parsed}
app.kafka.success=${KAFKA_TEAM_STATS_PERSISTED_SUCCESS_TOPIC:team-stats.persisted.success}
app.kafka.rejected=${KAFKA_TEAM_STATS_REJECTED_TOPIC:team-stats.rejected}
app.kafka.dlt=${KAFKA_TEAM_STATS_PERSISTENCE_DLT_TOPIC:team-stats.parsed.DLT}
app.kafka.max-poll=${KAFKA_MAX_POLL_RECORDS:500}
app.kafka.attempts=${KAFKA_RETRY_MAX_ATTEMPTS:3}
app.kafka.backoff=${KAFKA_RETRY_BACKOFF_MS:1000}